# OpenSSL target for Windows on Arm with MinGW-w64 (MSYS2's CLANGARM64);
# OpenSSL itself only has mingw (x86) and mingw64 (x64). It's mingw64
# without -m64 and without assembly: the perlasm output for arm64 is ELF or
# armasm syntax, neither of which MinGW's clang assembles.
# build.sh passes it with --config.
my %targets = (
    "mingwarm64" => {
        inherit_from     => [ "mingw-common" ],
        sys_id           => "MINGWARM64",
        bn_ops           => add("SIXTY_FOUR_BIT"),
        asm_arch         => undef,
        uplink_arch      => undef,
        perlasm_scheme   => undef,
        shared_rcflag    => "--target=pe-aarch64",
        multilib         => "64",
    },
);
